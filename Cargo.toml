[workspace]
resolver = "2"
members = [
    "crates/yappy-core",
    "crates/yappy-server",
    "crates/yappy-provider-kokoro",
    "crates/yappy-provider-openai",
    "crates/yappy-provider-avspeech",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/yourusername/yappy"
authors = ["Your Name <you@example.com>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "propagate-header"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Audio encoding
audiopus = "0.2"
mp3lame-encoder = "0.2"

# Text processing
# srx = "0.1"  # May need to verify crate availability

# Utilities
bytes = "1"
futures = "0.3"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
uuid = { version = "1", features = ["v4", "serde"] }

# HTTP client (for OpenAI provider)
reqwest = { version = "0.12", features = ["json", "stream"] }

# WebSocket client (for integration tests)
tokio-tungstenite = "0.26"

# ONNX inference (for Kokoro provider)
ort = "2.0.0-rc.11"
hf-hub = { version = "0.4", features = ["tokio"] }

# Internal crates
yappy-core = { path = "crates/yappy-core" }
yappy-provider-kokoro = { path = "crates/yappy-provider-kokoro" }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
# Set lint groups to lower priority so individual lints can override
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Allow some pedantic lints that are too noisy
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Don't require common metadata for internal crates
cargo_common_metadata = "allow"
# Multiple crate versions are often unavoidable in transitive dependencies
multiple_crate_versions = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
