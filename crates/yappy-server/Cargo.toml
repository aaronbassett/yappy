[package]
name = "yappy-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Yappy streaming TTS server"

[[bin]]
name = "yappy-server"
path = "src/main.rs"

[dependencies]
yappy-core = { workspace = true }

# Web framework
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI
clap = { workspace = true }

# Utilities
anyhow = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }

[features]
default = ["kokoro"]
kokoro = []
openai-tts = []
avspeech = []
all-providers = ["kokoro", "openai-tts", "avspeech"]

[lints]
workspace = true
